[project]
name = "job-search-collector"
version = "0.1.0"
description = "Standalone LinkedIn Jobs / Indeed vacancy collector (JobSpy live + CSV import pipeline)"
requires-python = ">=3.12"
dependencies = [
    "python-jobspy>=0.31.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
